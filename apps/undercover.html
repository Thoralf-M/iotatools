<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

html,body{height:100%;overflow-x:hidden}

#app{width:100%;max-width:460px;padding-bottom:60px}

input:focus,select:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(88,166,255,.15)}
select{-webkit-appearance:none;appearance:none;cursor:pointer}
label{display:block;font-size:12px;font-weight:700;color:#768390;margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px}
.field{margin-bottom:16px}
.game-code{font-family:'Courier New',monospace;font-size:36px;font-weight:900;letter-spacing:10px;text-align:center;color:#fff;padding:20px 16px;background:linear-gradient(135deg,rgba(59,130,246,.12),rgba(124,58,237,.12));border-radius:16px;border:1px solid rgba(88,166,255,.3);margin:12px 0;cursor:pointer;box-shadow:0 0 30px rgba(88,166,255,.1),inset 0 1px 0 rgba(255,255,255,.08);transition:all .2s;text-shadow:0 0 24px rgba(88,166,255,.5)}

.game-code-hint{text-align:center;font-size:12px;color:#768390;margin-top:6px}
.player-list{list-style:none}
.player-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:5px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}

.role-undercover{background:rgba(248,81,73,.12);color:#f87171;border:1px solid rgba(248,81,73,.22)}
.role-mrwhite{background:rgba(192,132,252,.12);color:#c084fc;border:1px solid rgba(192,132,252,.22)}
.player-you{font-size:10px;color:#768390;margin-left:4px;font-weight:500}
.player-host{font-size:10px;color:#f59e0b;margin-left:4px;font-weight:700}
.player-item.eliminated{opacity:.4;text-decoration:line-through}
.stats-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px}
.stat{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}
.stat-label{color:#768390}
.stat-val{margin-left:4px;color:#f0f6fc}
.phase-badge{display:inline-block;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px}
.phase-clue{background:rgba(88,166,255,.1);color:#60a5fa;border:1px solid rgba(88,166,255,.22)}

.phase-result{background:rgba(248,81,73,.1);color:#f87171;border:1px solid rgba(248,81,73,.22)}
.word-card{perspective:900px;cursor:pointer;margin:24px auto;width:100%;max-width:300px;height:170px}
.word-card-inner{position:relative;width:100%;height:100%;transition:transform .65s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}

.clue-list{margin:10px 0}
.clue-item{display:flex;gap:10px;padding:10px 12px;border-radius:10px;margin-bottom:4px;font-size:14px;align-items:flex-start}
.clue-item.current{background:rgba(88,166,255,.07);border:1px solid rgba(88,166,255,.2);box-shadow:0 0 16px rgba(88,166,255,.05)}

.clue-speaker{font-weight:700;flex-shrink:0;min-width:80px}
.clue-text{color:#768390;word-break:break-word}
.clue-text.submitted{color:#f0f6fc}
.clue-input-row{display:flex;gap:8px;margin-top:10px}
.clue-input-row input{flex:1}

.vote-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}

.vote-btn .vote-count{font-size:11px;color:#768390}
.vote-tally{margin:14px 0}
.tally-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;margin-bottom:5px}
.tally-bar-bg{flex:1;height:28px;background:rgba(255,255,255,.05);border-radius:6px;overflow:hidden}

.tally-name{min-width:80px;font-size:14px;font-weight:600}
.tally-votes{min-width:30px;text-align:right;font-size:14px;font-weight:800}
.eliminated-banner{text-align:center;padding:24px 20px;border-radius:16px;margin:14px 0}
.eliminated-banner.is-citizen{background:linear-gradient(135deg,rgba(88,166,255,.08),rgba(88,166,255,.03));border:1px solid rgba(88,166,255,.25);box-shadow:0 0 30px rgba(88,166,255,.07)}
.eliminated-banner.is-undercover{background:linear-gradient(135deg,rgba(248,81,73,.1),rgba(248,81,73,.03));border:1px solid rgba(248,81,73,.3);box-shadow:0 0 30px rgba(248,81,73,.08)}
.eliminated-banner.is-mrwhite{background:linear-gradient(135deg,rgba(192,132,252,.1),rgba(192,132,252,.03));border:1px solid rgba(192,132,252,.3);box-shadow:0 0 30px rgba(192,132,252,.08)}
.eliminated-name{font-size:26px;font-weight:900;margin-bottom:6px}
.eliminated-role{font-size:15px;font-weight:600}
.voter-list{margin-top:10px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.voter-chip{padding:3px 9px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:12px}
.winner-screen{text-align:center;padding:32px 0}
.winner-title{font-size:40px;font-weight:900;margin-bottom:8px;text-shadow:0 0 40px currentColor;animation:winPulse 2s ease-in-out infinite}
.winner-sub{font-size:15px;color:#768390;margin-bottom:20px}
.roles-reveal{text-align:left;margin:16px 0}
.role-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:10px;margin-bottom:5px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
.words-reveal{text-align:center;margin:16px 0;padding:20px;background:rgba(255,255,255,.03);border-radius:14px;border:1px solid rgba(255,255,255,.07)}
.words-reveal .pair{font-size:12px;color:#768390;margin-bottom:4px;text-transform:uppercase;letter-spacing:.8px}
.words-reveal .word{font-size:22px;font-weight:800;margin-bottom:4px}
.vote-history{margin:16px 0}
.vh-round{margin-bottom:14px}
.vh-label{font-size:11px;font-weight:800;color:#768390;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.vh-row{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;font-size:13px;margin-bottom:3px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04)}
.vh-voter{flex:1;font-weight:600}
.vh-arrow{color:#768390;font-size:11px;flex-shrink:0;padding:0 2px}
.vh-target{font-weight:700}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.toggle{width:50px;height:28px;border-radius:14px;background:rgba(255,255,255,.1);cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;border:1px solid rgba(255,255,255,.1)}
.toggle.on{background:linear-gradient(135deg,#3b82f6,#7c3aed);border-color:transparent}
.toggle::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.toggle.on::after{transform:translateX(22px)}
.rules-box{font-size:13px;color:#768390;line-height:1.7;padding:14px;background:rgba(255,255,255,.02);border-radius:10px;margin:10px 0}
.rules-box b{color:#f0f6fc}
.rules-box ol{padding-left:18px;margin:8px 0}.rules-box li{margin-bottom:4px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.1);border-top-color:#60a5fa;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
.status-msg{text-align:center;color:#768390;font-size:14px;padding:16px}
.mr-white-input{text-align:center;padding:24px 0}
.mr-white-input h2{color:#c084fc;font-size:24px}
.timer-bar{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin:10px 0}
.timer-fill{height:100%;background:linear-gradient(90deg,#34d399,#f59e0b 60%,#f87171);transition:width .1s linear}
.round-history{margin-top:14px}
.round-label{font-size:11px;font-weight:800;color:#3d4147;text-transform:uppercase;letter-spacing:1.5px;margin:12px 0 6px;padding-top:10px;border-top:1px solid rgba(255,255,255,.05)}
.copy-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#34d399,#059669);color:#fff;padding:10px 20px;border-radius:12px;font-size:14px;font-weight:700;z-index:999;animation:fadeUp .3s ease;box-shadow:0 4px 20px rgba(52,211,153,.4)}
.sep{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);margin:18px 0}
.hidden{display:none}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}

.chat-messages{max-height:200px;overflow-y:auto;padding:6px 0;margin-bottom:10px}
.chat-msg{display:flex;gap:6px;padding:6px 10px;border-radius:8px;font-size:13px;margin-bottom:2px;line-height:1.4}
.chat-msg:hover{background:rgba(255,255,255,.03)}
.chat-name{font-weight:700;flex-shrink:0}
.chat-text{color:#c9d1d9;word-break:break-word}
.chat-unread{display:inline-block;background:#f87171;color:#fff;border-radius:10px;padding:0 7px;font-size:11px;font-weight:800;margin-left:8px;vertical-align:middle}
.rename-card{border-color:rgba(248,81,73,.4)!important;box-shadow:0 0 20px rgba(248,81,73,.1)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function genCode(){let c='';for(let i=0;i<6;i++)c+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];return c}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pcolor(id){return COLORS[id%COLORS.length]}
function initial(name){return String(name).trim().charAt(0).toUpperCase()||'?'}

function toast(msg){
    const d=document.createElement('div');d.className='copy-toast';d.textContent=msg;
    document.body.appendChild(d);setTimeout(()=>d.remove(),2000);
}

function appendChatMsg(m){
    const container=$('chat-msgs');
    if(!container)return;
    const ph=container.querySelector('p.text-dim');if(ph)ph.remove();
    const div=document.createElement('div');div.className='chat-msg';
    div.innerHTML=`<span class="chat-name" style="color:${pcolor(m.id)}">${esc(m.name)}:</span> <span class="chat-text">${esc(m.text)}</span>`;
    container.appendChild(div);
    container.scrollTop=container.scrollHeight;
    setTimeout(()=>iota.resize(document.body.scrollHeight+40),50);
}

function updateChatBadge(){
    const hdr=$('chat-header');if(!hdr)return;
    const h3=hdr.querySelector('h3');if(!h3)return;
    h3.innerHTML=`Chat${unreadChat>0?`<span class="chat-unread">${unreadChat}</span>`:''}`;
}

const APP=()=>$('app');

    switch(S.screen){
        case'home':renderHome();break;
        case'create':renderCreate();break;
        case'join':renderJoin();break;
        case'lobby':renderLobby();break;

}

function renderGame(){
    let statsHtml=`<div class="stats-bar">
        <div class="stat"><span class="stat-label">Round</span><span class="stat-val">${S.round}</span></div>
        <div class="stat"><span class="stat-label">Alive</span><span class="stat-val">${S.stats.alive}/${S.stats.total}</span></div>
        <div class="stat"><span class="stat-label" style="color:#58a6ff">Citizens</span><span class="stat-val">${S.stats.citizens}</span></div>
        <div class="stat"><span class="stat-label" style="color:#f85149">UC</span><span class="stat-val">${S.stats.undercover}</span></div>
        ${S.stats.mrwhite!==undefined?`<div class="stat"><span class="stat-label" style="color:#bc8cff">MW</span><span class="stat-val">${S.stats.mrwhite}</span></div>`:''}
    </div>`;

    let wordCard=`<div class="word-card ${S.wordRevealed?'flipped':''}" onclick="flipWord()">
        <div class="word-card-inner">
            <div class="word-card-face word-card-front">Tap to reveal</div>
            <div class="word-card-face word-card-back ${S.myWord===null?'no-word':''}">${S.myWord===null?'Mr. White':esc(S.myWord)}</div>
        </div>
    </div>`;

    let content='';
    switch(S.phase){
        case'word_reveal':
            content=`${wordCard}
                <p class="text-center text-dim text-sm">Memorize your word, then hide it</p>
                ${S.isHost?'<button class="btn btn-primary mt16" onclick="hostAdvance()">Start Round 1</button>':'<div class="status-msg">Waiting for host to start the round...</div>'}`;
            break;
        case'clue':
            content=renderCluePhase()+
                `<div class="sep"></div>${wordCard}
                <p class="text-center text-dim text-sm">Your word (tap to show/hide)</p>`;
            break;
        case'vote_prompt':
            content=renderClueHistory(S.round)+
                `${S.isHost?`<div class="btn-row mt12">
                    <button class="btn btn-primary" onclick="hostStartVote()">Start Vote</button>
                    <button class="btn btn-secondary" onclick="hostSkipVote()">Next Round</button>
                </div>`:'<div class="status-msg">Host is deciding: vote or continue...</div>'}`;
            break;
        case'voting':
            content=renderVotingPhase();
            break;
        case'result':
            content=renderResultPhase();
            break;
        case'mrwhite_guess':
            content=renderMrWhiteGuess();
            break;
    }

    APP().innerHTML=statsHtml+'<div class="card">'+content+'</div>'+rulesHtml()+chatHtml();
    if(S.phase==='clue'){
        const ci=$('clue-input');
        if(ci)ci.focus();
    }
    if(chatOpen){setTimeout(()=>{const el=$('chat-msgs');if(el)el.scrollTop=el.scrollHeight;},50);}
}

function renderCluePhase(){
    const order=S.speakerOrder;
    const cur=S.currentSpeaker;
    const roundClues=S.clues[S.round]||{};
    const myTurn=order[cur]===S.myId;
    const amAlive=S.players[S.myId]&&S.players[S.myId].alive;

    let items=order.map((pid,idx)=>{
        const p=S.players[pid];
        if(!p)return '';
        const clue=roundClues[pid];
        const isCur=idx===cur;
        const isDone=clue!==undefined;
        const cls=isCur?'current':(isDone?'':'waiting');
        return `<div class="clue-item ${cls}">
            <span class="clue-speaker" style="color:${pcolor(pid)}">${esc(p.name)}</span>
            <span class="clue-text ${isDone?'submitted':''}">${isDone?esc(clue):(isCur?'giving clue...':'waiting')}</span>
        </div>`;
    }).join('');

    let inputHtml='';
    if(myTurn&&amAlive){
        inputHtml=`<div class="clue-input-row mt8">
            <input id="clue-input" type="text" maxlength="60" placeholder="Enter your clue..." onkeydown="if(event.key==='Enter')submitClue()">
            <button class="btn btn-primary btn-sm" onclick="submitClue()">Send</button>
        </div>`;
    }

    let skipHtml='';
    if(S.isHost&&!myTurn){
        skipHtml=`<button class="btn btn-secondary btn-sm mt8" onclick="hostSkipSpeaker()">Skip Speaker</button>`;
    }

    return `<span class="phase-badge phase-clue">Round ${S.round} &mdash; Clues</span>
        <div class="clue-list">${items}</div>${inputHtml}${skipHtml}
        ${renderClueHistory(S.round-1)}`;
}

function renderClueHistory(upToRound){
    if(upToRound<1)return '';
    let html='<div class="round-history">';
    for(let r=upToRound;r>=1;r--){
        const rc=S.clues[r];
        if(!rc)continue;
        html+=`<div class="round-label">Round ${r}</div>`;
        const order=S.speakerOrder;
        for(const pid of order){
            const p=S.players[pid];
            if(!p||rc[pid]===undefined)continue;
            html+=`<div class="clue-item">
                <span class="clue-speaker" style="color:${pcolor(pid)}">${esc(p.name)}</span>
                <span class="clue-text submitted">${esc(rc[pid])}</span>
            </div>`;
        }
    }
    return html+'</div>';
}

function renderVotingPhase(){
    const alive=S.players.filter(p=>p.alive&&p.id!==S.myId);
    const votedCount=S.isHost?Object.keys(S.votes).length:(S.voteCount||0);
    const totalVoters=S.players.filter(p=>p.alive).length;

    let grid=alive.map(p=>`
        <div class="vote-btn ${S.myVote===p.id?'selected':''}" onclick="castVote(${p.id})">
            <div class="vote-avatar" style="color:${pcolor(p.id)}">${initial(p.name)}</div>
            <div class="vote-name" style="color:${pcolor(p.id)}">${esc(p.name)}</div>
        </div>`).join('');

    const myP=S.players[S.myId];
    const canVote=myP&&myP.alive&&S.myVote===-1;

    return `<span class="phase-badge phase-vote">Voting</span>
        <p class="text-sm text-dim mb8">Vote for who you think is Undercover</p>
        <div class="vote-grid">${grid}</div>
        ${S.myVote>=0?`<p class="text-center text-dim text-sm mt8">You voted for <b>${esc(S.players[S.myVote]?.name||'?')}</b></p>`:''}
        ${!canVote&&S.myVote===-1?'<p class="text-center text-dim text-sm mt8">You cannot vote this round</p>':''}
        <p class="text-center text-dim text-sm mt8">Votes: ${votedCount}/${totalVoters}</p>
        ${renderClueHistory(S.round)}`;
}

function voteBreakdownHtml(votesMap){
    if(!votesMap||!Object.keys(votesMap).length)return '';
    const rows=Object.entries(votesMap).map(([vid,tid])=>{
        const voter=S.players[parseInt(vid)];
        const target=S.players[parseInt(tid)];
        if(!voter||!target)return '';
        return `<div class="vh-row">
            <span class="vh-voter" style="color:${pcolor(parseInt(vid))}">${esc(voter.name)}</span>
            <span class="vh-arrow">voted</span>
            <span class="vh-target" style="color:${pcolor(parseInt(tid))}">${esc(target.name)}</span>
        </div>`;
    }).join('');
    return rows?`<div style="margin-top:10px"><div class="vh-label">Who voted for whom</div>${rows}</div>`:'';
}

function renderResultPhase(){
    const lastElim=S.eliminated.length>0?S.eliminated[S.eliminated.length-1]:null;
    const tally=S.voteTally;
    const maxV=Math.max(1,...Object.values(tally));

    let tallyHtml=Object.entries(tally)
        .sort((a,b)=>b[1]-a[1])
        .map(([pid,cnt])=>{
            const p=S.players[parseInt(pid)];
            if(!p)return '';
            const pct=Math.round((cnt/maxV)*100);
            const isElim=lastElim&&lastElim.id===parseInt(pid);
            return `<div class="tally-row">
                <span class="tally-name" style="color:${pcolor(parseInt(pid))}">${esc(p.name)}</span>
                <div class="tally-bar-bg"><div class="tally-bar" style="width:${pct}%;background:${isElim?'#f87171':'rgba(255,255,255,.15)'}">${cnt}</div></div>
                <span class="tally-votes">${cnt}</span>
            </div>`;
        }).join('');

    let elimHtml='';
    if(lastElim){
        const rc=lastElim.role==='citizen'?'is-citizen':(lastElim.role==='undercover'?'is-undercover':'is-mrwhite');
        const rlabel=lastElim.role==='citizen'?'Citizen':(lastElim.role==='undercover'?'Undercover':'Mr. White');
        const rclass=lastElim.role==='citizen'?'role-citizen':(lastElim.role==='undercover'?'role-undercover':'role-mrwhite');
        // voters who voted for the eliminated player
        const voterNames=Object.entries(S.votes||{})
            .filter(([,tid])=>parseInt(tid)===lastElim.id)
            .map(([vid])=>S.players[parseInt(vid)])
            .filter(Boolean);
        const voterChips=voterNames.map(v=>`<span class="voter-chip" style="color:${pcolor(v.id)}">${esc(v.name)}</span>`).join('');
        elimHtml=`<div class="eliminated-banner ${rc}">
            <div class="eliminated-name">${esc(lastElim.name)}</div>
            <div class="eliminated-role"><span class="player-role ${rclass}">${rlabel}</span></div>
            ${voterChips?`<div class="voter-list">${voterChips}</div>`:''}
        </div>`;
    } else {
        elimHtml=`<div class="eliminated-banner" style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1)">
            <div class="eliminated-name">No elimination</div>
            <div class="text-dim text-sm">It was a tie!</div>
        </div>`;
    }

    return `<span class="phase-badge phase-result">Vote Result</span>
        <div class="vote-tally">${tallyHtml}</div>
        ${elimHtml}
        ${voteBreakdownHtml(S.votes)}
        ${S.isHost?'<button class="btn btn-primary mt12" onclick="hostAdvance()">Continue</button>':'<div class="status-msg">Waiting for host...</div>'}
        ${renderClueHistory(S.round)}`;
}

function renderMrWhiteGuess(){
    const isMW=S.myId===S.mrWhiteId;
    const pct=(S.mrWhiteTimerSec/30)*100;
    if(isMW){
        return `<div class="mr-white-input">
            <h2>You've been caught!</h2>
            <p style="color:#c084fc;font-size:28px;margin:6px 0 4px;font-weight:900">${S.mrWhiteTimerSec}s</p>
            <div class="timer-bar mb12"><div class="timer-fill" id="mw-timer" style="width:${pct}%"></div></div>
            <p class="text-dim text-sm mb12">Guess the Citizens' word to win!</p>
            <div class="clue-input-row">
                <input id="mw-guess" type="text" maxlength="40" placeholder="Your guess..." onkeydown="if(event.key==='Enter')submitMWGuess()">
                <button class="btn btn-primary btn-sm" onclick="submitMWGuess()">Guess</button>
            </div>
        </div>`;
    }
    const mwPlayer=S.players[S.mrWhiteId];
    return `<div class="text-center" style="padding:24px 0">
        <h2 style="color:#c084fc;font-size:22px;margin-bottom:6px">${mwPlayer?esc(mwPlayer.name)+' is':'Mr. White is'} guessing...</h2>
        <p style="color:#c084fc;font-size:36px;font-weight:900;margin:8px 0;text-shadow:0 0 20px rgba(192,132,252,.5)">${S.mrWhiteTimerSec}s</p>
        <div class="timer-bar mt8 mb8"><div class="timer-fill" id="mw-timer" style="width:${pct}%"></div></div>
        <p class="text-dim text-sm">One chance to guess the citizen word</p>
    </div>`;
}

function renderOver(){
    const wc=S.winner==='citizens'?'#58a6ff':(S.winner==='undercover'?'#f85149':'#bc8cff');
    const wl=S.winner==='citizens'?'Citizens Win!':(S.winner==='undercover'?'Undercovers Win!':'Mr. White Wins!');

    let rolesHtml=S.players.map(p=>{
        const role=S.roles[p.id]||'?';
        const rc=role==='citizen'?'role-citizen':(role==='undercover'?'role-undercover':'role-mrwhite');
        const rl=role==='citizen'?'Citizen':(role==='undercover'?'Undercover':'Mr. White');
        return `<div class="role-row">
            <span style="color:${pcolor(p.id)};font-weight:600">${esc(p.name)}</span>
            <span class="player-role ${rc}">${rl}</span>
        </div>`;
    }).join('');

    // Build full vote history across all rounds
    const voteHistoryHtml=(()=>{
        if(!S.eliminated.length&&!Object.keys(S.votes||{}).length)return '';
        let html='<div class="card"><h3>Vote History</h3><div class="vote-history">';
        S.eliminated.forEach(e=>{
            if(!e.votes||!Object.keys(e.votes).length)return;
            const rc=e.role==='citizen'?'role-citizen':(e.role==='undercover'?'role-undercover':'role-mrwhite');
            const rl=e.role==='citizen'?'Citizen':(e.role==='undercover'?'Undercover':'Mr. White');
            html+=`<div class="vh-round"><div class="vh-label">Round ${e.round} — eliminated: <span style="font-weight:800">${esc(e.name)}</span> <span class="player-role ${rc}" style="font-size:10px">${rl}</span></div>`;
            Object.entries(e.votes).forEach(([vid,tid])=>{
                const voter=S.players[parseInt(vid)];
                const target=S.players[parseInt(tid)];
                if(!voter||!target)return;
                html+=`<div class="vh-row"><span class="vh-voter" style="color:${pcolor(parseInt(vid))}">${esc(voter.name)}</span><span class="vh-arrow">voted</span><span class="vh-target" style="color:${pcolor(parseInt(tid))}">${esc(target.name)}</span></div>`;
            });
            html+='</div>';
        });
        html+='</div></div>';
        return html;
    })();

    APP().innerHTML=`
    <div class="winner-screen">
        <div style="font-size:52px;margin-bottom:4px;line-height:1">${S.winner==='citizens'?'&#x1F3C6;':S.winner==='undercover'?'&#x1F5E1;':'&#x1F977;'}</div>
        <div class="winner-title" style="color:${wc}">${wl}</div>
        <p class="winner-sub">${esc(S.winDetail)}</p>
    </div>
    <div class="words-reveal">
        <div style="display:flex;gap:16px;justify-content:center">
            <div>
                <div class="pair">Citizen word</div>
                <div class="word" style="color:#60a5fa">${esc(S.citizenWord)}</div>
            </div>
            <div style="color:rgba(255,255,255,.15);font-size:24px;align-self:center">vs</div>
            <div>
                <div class="pair">Undercover word</div>
                <div class="word" style="color:#f87171">${esc(S.undercoverWord)}</div>
            </div>
        </div>
    </div>
    <div class="card">
        <h3>All Roles</h3>
        ${rolesHtml}
    </div>
    ${voteHistoryHtml}
    ${S.isHost?`
    <div class="btn-row mt16">
        <button class="btn btn-primary" onclick="playAgainHost()">Play Again</button>
        <button class="btn btn-secondary" onclick="goHome()">Exit</button>
    </div>`:`
    <button class="btn btn-secondary mt16" onclick="goHome()">Leave Game</button>
    <div class="status-msg mt8">Waiting for host to start a new game...</div>`}`;
}

function fallbackCopy(text){
    const ta=document.createElement('textarea');
    ta.value=text;ta.style.cssText='position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);ta.focus();ta.select();
    try{document.execCommand('copy');toast('Code copied!')}
    catch(e){toast('Code: '+text)}
    ta.remove();
}

window.doCreate=async function(){
    const name=($('cname')||{}).value?.trim();
    if(!name){toast('Enter your name');return}
    S.myName=name;
    S.settings.difficulty=($('cdiff')||{}).value||'medium';
    S.settings.numUndercover=parseInt(($('cuc')||{}).value)||1;
    S.isHost=true;
    S.gameCode=genCode();
    S.myId=0;
    S.mySlot=-1;
    S.players=[{id:0,name,slot:-1,addr:S.myAddr,alive:true,connected:true}];
    S.screen='lobby';
    S.lobbyRunning=true;
    render();

    try{
        await iota.storage.setShared('uc:'+S.gameCode+':lobby',JSON.stringify(S.settings));
        lobbyAbort=false;
        hostLobbyLoop();
    }catch(e){
        toast('Failed to create lobby: '+e.message);
        S.screen='create';render();
    }
};

window.doJoin=async function(){
    const code=(($('jcode')||{}).value||'').trim().toUpperCase();
    const name=(($('jname')||{}).value||'').trim();
    if(!code||code.length!==6){toast('Enter a 6-character game code');return}
    if(!name){toast('Enter your name');return}
    S.gameCode=code;S.myName=name;
    S.connecting=true;S.connectMsg='Looking for game...';render();

    try{
        const info=await iota.storage.getShared('uc:'+code+':lobby');
        if(!info){S.connecting=false;toast('Game not found');render();return}
        S.settings=JSON.parse(info);
        S.connectMsg='Claiming slot...';render();

        let mySlot=-1;
        for(let attempt=0;attempt<MAX_SLOTS;attempt++){
            const key='uc:'+code+':s'+attempt;
            const val=await iota.storage.getShared(key);
            if(!val){
                await iota.storage.setShared(key,name+'\t'+S.myAddr);
                await sleep(2500);
                const verify=await iota.storage.getShared(key);
                if(verify&&verify.includes(S.myAddr)){mySlot=attempt;break}
            }
        }
        if(mySlot<0){S.connecting=false;toast('Game is full');render();return}
        S.mySlot=mySlot;
        let channel=null;
        for(let rtcAttempt=0;rtcAttempt<2&&!channel;rtcAttempt++){
            try{
                S.connectMsg='Connecting to host'+(rtcAttempt>0?' (retry)':'')+'...';render();
                const res=await iota.webrtc.join({roomId:'uc-'+code+'-'+mySlot+(rtcAttempt>0?'-r'+rtcAttempt:''),iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}],timeout:120000});
                channel=res.channel;
            }catch(rtcErr){
                console.log('WebRTC join attempt '+(rtcAttempt+1)+' failed',rtcErr);
                if(rtcAttempt===0)await sleep(3000);
            }
        }
        if(!channel)throw new Error('Could not connect to host. Make sure you are using a different browser or device than the host.');
        hostChannel=channel;
        channel.onmessage=e=>{try{handleHostMsg(JSON.parse(e.data))}catch(err){console.error(err)}};
        channel.onclose=()=>{toast('Disconnected from host');goHome()};

        sendToHost({t:'join',d:{name,addr:S.myAddr,slot:mySlot}});
        S.connecting=false;
        S.screen='lobby';
        render();
    }catch(e){
        S.connecting=false;
        toast('Failed to join: '+(e.message||e));
        render();
    }
};

window.startGame=function(){
    if(!S.isHost)return;
    const n=S.players.length;
    const minP=S.settings.numUndercover+(S.settings.mrWhite?1:0)+2;
    if(n<minP){toast('Need at least '+minP+' players');return}
    if(S.settings.numUndercover>=n-1){toast('Too many undercovers for this player count');return}

    lobbyAbort=true;
    S.lobbyRunning=false;

    const pairs=WORDS[S.settings.difficulty]||WORDS.medium;
    const pair=pairs[Math.floor(Math.random()*pairs.length)];
    const swap=Math.random()<0.5;
    S.citizenWord=swap?pair[1]:pair[0];
    S.undercoverWord=swap?pair[0]:pair[1];

    const indices=shuffle([...Array(n).keys()]);
    const roles={};const words={};
    let idx=0;
    for(let i=0;i<S.settings.numUndercover;i++){roles[indices[idx]]='undercover';words[indices[idx]]=S.undercoverWord;idx++}
    if(S.settings.mrWhite){roles[indices[idx]]='mrwhite';words[indices[idx]]=null;idx++}
    for(;idx<n;idx++){roles[indices[idx]]='citizen';words[indices[idx]]=S.citizenWord}

    S.roles=roles;
    S.myWord=words[0];
    S.myRole=roles[0];
    S.phase='word_reveal';
    S.round=1;
    S.clues={};S.eliminated=[];S.winner=null;
    S.wordRevealed=false;
    S.screen='game';
    calcStats();

    for(const p of S.players){
        if(p.id===0)continue;
        sendTo(p.slot,{t:'w',d:{word:words[p.id]}});
    }
    broadcastState();
    render();
};

window.hostAdvance=function(){
    if(!S.isHost)return;
    if(S.phase==='word_reveal'){
        S.speakerOrder=shuffle(S.players.filter(p=>p.alive).map(p=>p.id));
        S.currentSpeaker=0;
        if(!S.clues[S.round])S.clues[S.round]={};
        S.phase='clue';
    } else if(S.phase==='result'){
        const wc=checkWin();
        if(wc){
            endGame(wc.winner,wc.detail);
            return;
        }
        S.round++;
        S.speakerOrder=shuffle(S.players.filter(p=>p.alive).map(p=>p.id));
        S.currentSpeaker=0;
        if(!S.clues[S.round])S.clues[S.round]={};
        S.votes={};S.myVote=-1;S.voteTally={};
        S.phase='clue';
    }
    broadcastState();render();
};

window.hostStartVote=function(){
    if(!S.isHost)return;
    S.phase='voting';S.votes={};S.myVote=-1;
    broadcastState();render();
};

window.hostSkipVote=function(){
    if(!S.isHost)return;
    S.round++;
    S.speakerOrder=shuffle(S.players.filter(p=>p.alive).map(p=>p.id));

    S.phase='clue';

};

window.hostSkipSpeaker=function(){

/* ==============================
   NETWORKING - HOST
   ============================== */
const ICE_SERVERS=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}];

async function hostLobbyLoop(preDiscovered={}){
    const code=S.gameCode;
    const discovered={...preDiscovered};

    while(!lobbyAbort&&S.screen==='lobby'){
        const checks=[];
        for(let sl=0;sl<MAX_SLOTS;sl++){
            if(discovered[sl])continue;
            checks.push(iota.storage.getShared('uc:'+code+':s'+sl).then(v=>v?{slot:sl,val:v}:null).catch(()=>null));
        }
        const results=(await Promise.all(checks)).filter(Boolean);

        for(const r of results){
            if(lobbyAbort)return;
            if(discovered[r.slot])continue;
            discovered[r.slot]=true;
            const parts=r.val.split('\t');
            const name=parts[0],addr=parts[1]||'';

            let connected=false;
            for(let attempt=0;attempt<2&&!connected;attempt++){
                try{
                    S.connectMsg='Connecting to '+name+(attempt>0?' (retry)':'')+'...';render();
                    const {channel}=await iota.webrtc.host({roomId:'uc-'+code+'-'+r.slot+(attempt>0?'-r'+attempt:''),iceServers:ICE_SERVERS,timeout:90000});
                    const pid=S.players.length;
                    const player={id:pid,name,slot:r.slot,addr,alive:true,connected:true};
                    S.players.push(player);
                    channels[r.slot]=channel;
                    connected=true;

                    channel.onmessage=e=>{try{handlePlayerMsg(r.slot,JSON.parse(e.data))}catch(err){console.error(err)}};
                    channel.onclose=()=>{
                        const pp=S.players.find(x=>x.slot===r.slot);
                        if(pp)pp.connected=false;
                        if(S.screen==='lobby'){render()}
                    };

                    sendTo(r.slot,{t:'welcome',d:{id:pid,players:S.players.map(p=>({id:p.id,name:p.name,alive:p.alive,connected:p.connected}))}});
                    broadcast({t:'plist',d:{players:S.players.map(p=>({id:p.id,name:p.name,alive:p.alive,connected:p.connected}))}});
                    if(S.players.filter(p=>p.name.toLowerCase()===name.toLowerCase()).length>1){
                        sendTo(r.slot,{t:'nameError',d:{msg:'Name "'+name+'" is already taken. Please choose a different name.'}});
                    }
                    render();
                }catch(e){
                    console.log('WebRTC attempt '+(attempt+1)+' failed for slot '+r.slot,e);
                    if(attempt===0)await sleep(3000);
                }
            }
            if(!connected){
                S.connectMsg='';render();
                console.log('Could not connect to player at slot '+r.slot);
            }
        }
        await sleep(POLL_MS);
    }
}

function sendTo(slot,msg){
    const ch=channels[slot];
    if(ch&&ch.readyState==='open')ch.send(JSON.stringify(msg));
}

function broadcast(msg){
    const data=JSON.stringify(msg);
    for(const sl in channels){
        const ch=channels[sl];
        if(ch&&ch.readyState==='open')ch.send(data);
    }
}

function broadcastState(){
    const view={
        phase:S.phase,round:S.round,
        players:S.players.map(p=>({id:p.id,name:p.name,alive:p.alive,connected:p.connected})),
        speakerOrder:S.speakerOrder,currentSpeaker:S.currentSpeaker,
        clues:S.clues,
        votes:S.phase==='result'?S.votes:{},
        voteTally:S.phase==='result'?S.voteTally:{},
        voteCount:S.phase==='voting'?Object.keys(S.votes).length:0,
        votedIds:S.phase==='voting'?Object.keys(S.votes).map(Number):[],
        eliminated:S.eliminated.map(e=>({id:e.id,name:e.name,role:e.role,round:e.round,votes:e.votes||{}})),
        stats:S.stats,winner:S.winner,winDetail:S.winDetail||'',
        citizenWord:S.winner?S.citizenWord:'',
        undercoverWord:S.winner?S.undercoverWord:'',
        roles:S.winner?S.roles:{},
        mrWhiteGuessing:S.mrWhiteGuessing,mrWhiteId:S.mrWhiteId,
        mrWhiteTimerSec:S.mrWhiteTimerSec,
        settings:S.settings,
    };
    broadcast({t:'s',d:view});
}

function handlePlayerMsg(slot,msg){
    const player=S.players.find(p=>p.slot===slot);
    if(!player)return;

    switch(msg.t){
        case'join':{
            const newName=msg.d.name;
            const isDup=S.players.some(p=>p.id!==player.id&&p.name.toLowerCase()===newName.toLowerCase());
            if(isDup){
                sendTo(player.slot,{t:'nameError',d:{msg:'Name "'+newName+'" is already taken. Please choose a different name.'}});
            }else{
                player.name=newName;
                broadcast({t:'plist',d:{players:S.players.map(p=>({id:p.id,name:p.name,alive:p.alive,connected:p.connected}))}});
                render();
            }
            break;
        }
        case'c':
            if(S.phase!=='clue')return;
            if(S.speakerOrder[S.currentSpeaker]!==player.id)return;
            if(!S.clues[S.round])S.clues[S.round]={};
            S.clues[S.round][player.id]=msg.d.text;
            advanceSpeaker();
            broadcastState();render();
            break;
        case'v':
            if(S.phase!=='voting')return;
            S.votes[player.id]=msg.d.target;
            checkAllVotes();
            broadcastState();render();
            break;
        case'm':
            if(S.phase!=='mrwhite_guess')return;
            handleMWGuessResult(msg.d.word);
            break;
        case'chat':{
            const cm={id:player.id,name:player.name,text:msg.d.text};
            chatMessages.push(cm);
            broadcast({t:'chatmsg',d:cm});
            if(chatOpen){appendChatMsg(cm);}
            else{unreadChat++;updateChatBadge();}
            break;
        }
    }
}

/* ==============================
   NETWORKING - PLAYER
   ============================== */
function sendToHost(msg){
    if(hostChannel&&hostChannel.readyState==='open')hostChannel.send(JSON.stringify(msg));
}

function handleHostMsg(msg){
    switch(msg.t){
        case'welcome':
            S.myId=msg.d.id;
            S.players=msg.d.players.map(p=>({...p,slot:p.slot||0}));
            render();
            break;
        case'plist':
            S.players=msg.d.players.map(p=>({...p,slot:p.slot||0}));
            // If we had a pending name and host accepted it, clear the error
            if(S.namePending){
                const me=S.players[S.myId];
                if(me&&me.name.toLowerCase()===S.myName.toLowerCase()){
                    S.namePending=false;S.nameError='';
                }
            }
            render();
            break;
        case'w':
            S.myWord=msg.d.word;
            break;
        case's':
            applyStateView(msg.d);
            render();
            break;
        case'nameError':
            S.nameError=msg.d.msg;
            S.namePending=true;
            render();
            break;
        case'restart':{
            if(mrWhiteTimer)clearTimeout(mrWhiteTimer);
            if(mrWhiteCountdown)clearInterval(mrWhiteCountdown);
            const rPlayers=msg.d.players.map(p=>({...p,slot:p.slot||0}));
            S=Object.assign({},S,{
                screen:'lobby',phase:'',round:0,
                myWord:null,wordRevealed:false,
                eliminated:[],winner:null,winDetail:'',
                votes:{},myVote:-1,voteTally:{},
                clues:{},roles:{},
                speakerOrder:[],currentSpeaker:0,
                stats:{},voteCount:0,votedIds:[],
                mrWhiteGuessing:false,mrWhiteId:-1,mrWhiteTimerSec:30,
                nameError:'',namePending:false,
                players:rPlayers,
            });
            render();
            break;
        }
        case'chatmsg':{
            const cm=msg.d;
            chatMessages.push(cm);
            if(chatOpen){appendChatMsg(cm);}
            else{unreadChat++;updateChatBadge();}
            break;
        }
    }
}

function applyStateView(v){
    S.phase=v.phase;S.round=v.round;
    S.players=v.players;
    S.speakerOrder=v.speakerOrder||[];
    S.currentSpeaker=v.currentSpeaker||0;
    S.clues=v.clues||{};
    S.votes=v.votes||{};
    S.voteTally=v.voteTally||{};
    S.eliminated=v.eliminated||[];
    S.stats=v.stats||{};
    S.mrWhiteGuessing=v.mrWhiteGuessing||false;
    S.mrWhiteId=v.mrWhiteId!=null?v.mrWhiteId:-1;
    S.mrWhiteTimerSec=v.mrWhiteTimerSec!=null?v.mrWhiteTimerSec:30;
    S.settings=v.settings||S.settings;
    S.voteCount=v.voteCount||0;
    S.votedIds=v.votedIds||[];

    if(v.winner){
        S.winner=v.winner;
        S.winDetail=v.winDetail||'';
        S.citizenWord=v.citizenWord||'';
        S.undercoverWord=v.undercoverWord||'';
        S.roles=v.roles||{};
        S.screen='over';
    }else{
        S.screen='game';
    }

    if(v.phase!=='voting'){S.myVote=-1}
    else if(v.votedIds&&v.votedIds.includes(S.myId)){/* keep local vote */}
    else if(S.myVote===-1){/* no vote yet */}
}

/* ==============================
   GAME LOGIC
   ============================== */
function advanceSpeaker(){
    S.currentSpeaker++;
    while(S.currentSpeaker<S.speakerOrder.length){
        const pid=S.speakerOrder[S.currentSpeaker];
        const p=S.players[pid];
        if(p&&p.alive&&p.connected)break;
        if(!S.clues[S.round])S.clues[S.round]={};
        S.clues[S.round][pid]='(offline)';
        S.currentSpeaker++;
    }
    if(S.currentSpeaker>=S.speakerOrder.length){
        S.phase='vote_prompt';
    }
}

function checkAllVotes(){
    const voters=S.players.filter(p=>p.alive);
    const allVoted=voters.every(p=>S.votes[p.id]!==undefined);
    if(!allVoted){broadcastState();render();return}

    const tally={};
    S.players.filter(p=>p.alive).forEach(p=>{tally[p.id]=0});
    for(const vid in S.votes){tally[S.votes[vid]]=(tally[S.votes[vid]]||0)+1}
    S.voteTally=tally;

    const maxVotes=Math.max(...Object.values(tally));
    const tied=Object.entries(tally).filter(([,v])=>v===maxVotes);

    if(tied.length===1){
        const elimId=parseInt(tied[0][0]);
        const elimP=S.players[elimId];
        const role=S.roles[elimId];
        elimP.alive=false;
        S.eliminated.push({id:elimId,name:elimP.name,role,round:S.round,votes:{...S.votes}});
        calcStats();

        if(role==='mrwhite'){
            S.mrWhiteGuessing=true;
            S.mrWhiteId=elimId;
            S.mrWhiteTimerSec=30;
            S.phase='mrwhite_guess';
            broadcastState();render();
            startMWTimer();
            return;
        }
    }

    calcStats();
    S.phase='result';
    broadcastState();render();
}

function startMWTimer(){
    if(mrWhiteTimer)clearTimeout(mrWhiteTimer);
    if(mrWhiteCountdown)clearInterval(mrWhiteCountdown);

    mrWhiteCountdown=setInterval(()=>{
        S.mrWhiteTimerSec--;
        if(S.mrWhiteTimerSec<=0){
            clearInterval(mrWhiteCountdown);
            return;
        }
        broadcastState();render();
    },1000);

    mrWhiteTimer=setTimeout(()=>{
        clearInterval(mrWhiteCountdown);
        S.mrWhiteGuessing=false;
        S.mrWhiteTimerSec=0;
        calcStats();
        const wc=checkWin();
        if(wc){endGame(wc.winner,wc.detail);return}
        S.phase='result';
        broadcastState();render();
    },30000);
}

function handleMWGuessResult(guess){
    if(mrWhiteTimer)clearTimeout(mrWhiteTimer);
    if(mrWhiteCountdown)clearInterval(mrWhiteCountdown);
    S.mrWhiteGuessing=false;

    if(guess.trim().toLowerCase()===S.citizenWord.toLowerCase()){
        endGame('mrwhite','Mr. White correctly guessed "'+S.citizenWord+'"!');
        return;
    }

    calcStats();
    const wc=checkWin();
    if(wc){endGame(wc.winner,wc.detail);return}
    S.phase='result';
    broadcastState();render();
}

function calcStats(){
    const alive=S.players.filter(p=>p.alive);
    let citizens=0,undercover=0,mrwhite=0;
    alive.forEach(p=>{
        const r=S.roles[p.id];
        if(r==='citizen')citizens++;
        else if(r==='undercover')undercover++;
        else if(r==='mrwhite')mrwhite++;
    });
    S.stats={total:S.players.length,alive:alive.length,citizens,undercover,mrwhite:S.settings.mrWhite?mrwhite:undefined};
}

function checkWin(){
    const alive=S.players.filter(p=>p.alive);
    let citizens=0,undercover=0,mrwhite=0;
    alive.forEach(p=>{
        const r=S.roles[p.id];
        if(r==='citizen')citizens++;
        else if(r==='undercover')undercover++;
        else if(r==='mrwhite')mrwhite++;
    });

    const threats=undercover+mrwhite;
    if(threats===0)return{winner:'citizens',detail:'All impostors have been found!'};
    if(undercover>=citizens)return{winner:'undercover',detail:'Undercovers outnumber the citizens!'};
    if(threats>=citizens&&undercover>0)return{winner:'undercover',detail:'Impostors outnumber the citizens!'};
    if(alive.length<=2&&threats>0){
        if(undercover>0)return{winner:'undercover',detail:'Too few players left to vote!'};
        return{winner:'mrwhite',detail:'Mr. White survived to the end!'};
    }
    return null;
}

function endGame(winner,detail){
    S.winner=winner;S.winDetail=detail;S.screen='over';
    broadcastState();render();
}

/* ==============================
   INIT
   ============================== */
try{
    const [addr]=await Promise.all([iota.getAddress(),iota.getNetwork()]);
    S.myAddr=addr;
    render();
}catch(e){
    APP().innerHTML='<div class="status-msg" style="color:#f85149">Failed to connect: '+(e.message||e)+'</div>';
}

})();
</script>
