name: CI

on:
    push:
        branches: [develop]
    pull_request:
        branches: [develop]

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Install dependencies
              run: pnpm install

            - name: Type check
              run: pnpm check

            - name: Run tests
              run: pnpm test
