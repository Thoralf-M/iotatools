name: CI

on:
    push:
        branches: [develop]
    pull_request:
        branches: [develop]
        types: [opened, synchronize, reopened]

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install pnpm
              run: npm install -g pnpm@11.24.0

            - name: Install dependencies
              run: pnpm install

            - name: Type check
              run: pnpm check

            - name: Run tests
              run: pnpm test
